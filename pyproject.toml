[project]
name = "ocr-bakeoff"
version = "0.1.0"
description = "Compare OCR engines - vision LLMs and classic OCR - on your own documents, with header and footer recall as the headline metric."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "pymupdf>=1.24",
    "requests>=2.31",
    "numpy>=1.26",
    "opencv-python>=4.9",
    "rapidocr>=3.0",
    "onnxruntime>=1.18",
    "huggingface_hub>=0.24",
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.2",
    "rapidfuzz>=3.14.6",
]

[project.scripts]
ocr-bakeoff = "ocr_bakeoff.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocr_bakeoff"]

# One ruff setup (2026-10-26), run by scripts/ci.sh.
[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# E501: the formatter decides line length. E741: `l` for a line is used on
# purpose in the text code. B905: zip(strict=) would change behaviour on
# uneven input.
ignore = ["E501", "E741", "B905"]
